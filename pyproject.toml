[project]
name = "parallax"
version = "0.1.0"
description = "Same incident, different angle — measured."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "requests>=2.32",
    "jieba>=0.42",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Kept optional so the crawler — the part that must run from day one — installs
# without dragging in torch. See notes in the plan re: Intel-Mac torch support.
nlp = ["transformers", "torch", "scikit-learn", "datasets"]
llm = ["anthropic>=0.40"]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
