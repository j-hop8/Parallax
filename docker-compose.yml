# Postgres for Phase 1. Elasticsearch (Phase 2) and Kafka (Phase 3) get added as
# services here later; that is the reason this file exists rather than a bare
# `docker run`.
#
# The data volume is named, not a bind mount: tier-1 crawl data cannot be
# re-fetched, so it must survive `docker compose down` and container rebuilds.

services:
  db:
    image: postgres:16
    # No container_name: a fixed name forbids a second project on the same
    # host, and the restore drill (ops/README.md §4) needs exactly that.
    restart: unless-stopped
    environment:
      POSTGRES_DB: parallax
      POSTGRES_USER: parallax
      # "parallax" is the laptop default and fine behind the loopback bind
      # below. On a shared host set PARALLAX_DB_PASSWORD in .env (compose reads
      # it from this directory; so does settings.py for the URL).
      POSTGRES_PASSWORD: ${PARALLAX_DB_PASSWORD:-parallax}
      # Postgres bakes the collation into initdb, so it is pinned here rather
      # than inherited from whatever locale the host happens to have.
      LANG: C.UTF-8
    ports:
      # Loopback only: on a VPS an unqualified "5433:5432" is a public Postgres.
      # 5433 so a future native Postgres cannot clash; PARALLAX_DB_PORT exists
      # for a second, throwaway project (the restore drill in ops/README.md).
      - "127.0.0.1:${PARALLAX_DB_PORT:-5433}:5432"
    volumes:
      - parallax_pgdata:/var/lib/postgresql/data
      # No bind mount for db/: Docker Desktop on macOS silently presents an
      # unshared bind path as an empty directory rather than erroring, which made
      # `psql -f /schema/schema.sql` fail while `docker inspect` still showed the
      # mount. `make db.migrate` pipes the SQL over stdin instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  parallax_pgdata:
